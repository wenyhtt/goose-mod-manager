[package]
name = "goose-mod-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", features = ["default"] }
egui_extras = { version = "0.35.0", features = ["image"] }
env_logger = "0.11.11"
gilrs = "0.11.2"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
